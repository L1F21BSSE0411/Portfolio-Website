name: Linting Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install htmlhint
        run: npm install --save-dev htmlhint

      - name: Ensure htmlhint has execute permission
        run: chmod +x ./node_modules/.bin/htmlhint  # Add execute permission to htmlhint

      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"  # Run htmlhint with npx

      - name: Install stylelint
        run: npm install --save-dev stylelint

      - name: Ensure stylelint has execute permission
        run: chmod +x ./node_modules/.bin/stylelint  # Add execute permission to stylelint

      - name: Lint CSS Files
        run: npx stylelint "**/*.css"  # Run stylelint with npx
